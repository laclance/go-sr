name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Minimum Go Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up minimum Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Test
        run: go test ./...

  quality:
    name: Current Go Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up current Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Show Go version
        run: go version

      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.13.2

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: golangci-lint
        run: golangci-lint run

      - name: Coverage
        run: |
          coverage_file="${RUNNER_TEMP}/go-sr-coverage.out"
          go test -coverprofile="${coverage_file}" ./...
          total="$(go tool cover -func="${coverage_file}" | awk '/^total:/ {print $3}')"
          echo "coverage=${total}"
          test "${total}" = "100.0%"

      - name: Fuzz aggregate smoke
        run: go test -run=^$ -fuzz=FuzzAggregateCandlesToTimeframe -fuzztime=5s

      - name: Fuzz compute smoke
        run: go test -run=^$ -fuzz=FuzzComputeInvariants -fuzztime=5s
