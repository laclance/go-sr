name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Minimum Go Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up minimum Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Test
        run: go test ./...

  quality:
    name: Current Go Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up current Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true

      - name: Show Go version
        run: go version

      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: golangci-lint
        run: golangci-lint run

      - name: Coverage
        run: |
          coverage_file="${RUNNER_TEMP}/go-sr-coverage.out"
          minimum="95.0"
          go test -coverprofile="${coverage_file}" ./...
          coverage="$(go tool cover -func="${coverage_file}")"
          printf '%s\n' "${coverage}"
          total="$(printf '%s\n' "${coverage}" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "coverage=${total}% (minimum ${minimum}%)"
          awk -v total="${total}" -v minimum="${minimum}" \
            'BEGIN { exit !(total + 0 >= minimum + 0) }'

      - name: Fuzz aggregate smoke
        run: go test -run=^$ -fuzz=FuzzAggregateCandlesToTimeframe -fuzztime=5s

      - name: Fuzz compute smoke
        run: go test -run=^$ -fuzz=FuzzComputeInvariants -fuzztime=5s

  bbgo-example:
    name: BBGO Example Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up current Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false

      - name: Show Go version
        run: go version

      - name: Verify root module remains BBGO-free
        run: |
          if go list -m all | grep -q '^github.com/c9s/bbgo '; then
            echo 'BBGO unexpectedly present in the root module graph' >&2
            exit 1
          fi

      - name: Test BBGO example compatibility
        working-directory: examples/bbgo
        run: |
          go list -m github.com/c9s/bbgo
          go test -mod=mod ./...
