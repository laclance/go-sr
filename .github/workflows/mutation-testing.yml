name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: Set up current Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Install Gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@b48a4aad17eff33dc7262e0d1487b1a4d6eec322

      - name: Run mutation testing
        run: gremlins unleash --output="${RUNNER_TEMP}/go-sr-mutation.json"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ github.run_id }}
          path: ${{ runner.temp }}/go-sr-mutation.json
          if-no-files-found: error
          retention-days: 30
